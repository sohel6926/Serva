<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | SERVA</title>
    <meta name="description" content="The page you are looking for does not exist on SERVA. Discover Home Services, Contractors, Events, Agriculture, and Moving & Shifting." />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #F8FAFC;
        color: #0F172A;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: #ffffff;
        border: 1px solid #E2E8F0;
        border-radius: 16px;
        padding: 40px 32px;
        max-width: 480px;
        width: 100%;
        box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.05);
      }
      .logo-wrap {
        margin-bottom: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .logo-img {
        max-height: 56px;
        width: auto;
        object-fit: contain;
      }
      .error-code {
        font-size: 5rem;
        font-weight: 800;
        line-height: 1;
        color: #033E8C;
        margin-bottom: 8px;
        letter-spacing: -0.05em;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: #0F172A;
        margin-bottom: 12px;
      }
      p {
        font-size: 0.95rem;
        color: #64748B;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      .actions {
        display: flex;
        gap: 12px;
        flex-direction: column;
      }
      @media (min-width: 440px) {
        .actions {
          flex-direction: row;
          justify-content: center;
        }
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 20px;
        border-radius: 10px;
        font-size: 0.95rem;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.15s ease-in-out;
      }
      .btn-primary {
        background-color: #033E8C;
        color: #ffffff;
      }
      .btn-primary:hover {
        background-color: #022B63;
      }
      .btn-secondary {
        background-color: #F1F5F9;
        color: #1E293B;
      }
      .btn-secondary:hover {
        background-color: #E2E8F0;
      }
      .category-pills {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid #E2E8F0;
      }
      .pill {
        display: inline-block;
        padding: 5px 12px;
        background-color: #EBF3FE;
        color: #033E8C;
        border-radius: 9999px;
        font-size: 0.8rem;
        font-weight: 600;
        text-decoration: none;
        transition: background 0.15s ease;
      }
      .pill:hover {
        background-color: #D6E6FD;
      }
      .footer-note {
        margin-top: 20px;
        font-size: 0.8rem;
        color: #94A3B8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo-wrap">
        <img src="/serva-logo.png" alt="SERVA Logo" class="logo-img" />
      </div>
      <div class="error-code">404</div>
      <h1>Page Not Found</h1>
      <p>The page you are looking for might have been moved, removed, or is temporarily unavailable.</p>
      <div class="actions">
        <a href="/" class="btn btn-primary">Go to Homepage</a>
        <a href="/services" class="btn btn-secondary">Browse Services</a>
      </div>
      <div class="category-pills">
        <a href="/home-services" class="pill">Home Services</a>
        <a href="/contractors" class="pill">Contractors</a>
        <a href="/agriculture" class="pill">Agriculture</a>
        <a href="/events" class="pill">Events</a>
        <a href="/moving" class="pill">Moving</a>
      </div>
      <div class="footer-note">SERVA — Multiple Services Provider · All Your Needs, One Platform</div>
    </div>
  </body>
</html>
